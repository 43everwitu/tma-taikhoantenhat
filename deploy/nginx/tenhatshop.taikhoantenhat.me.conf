server {
    server_name tenhatshop.taikhoantenhat.me;
    client_max_body_size 20m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_cache tenhatshop_static;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires;
        proxy_set_header Host $host;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tenhatshop.taikhoantenhat.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenhatshop.taikhoantenhat.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = tenhatshop.taikhoantenhat.me) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name tenhatshop.taikhoantenhat.me;
    return 404;
}
